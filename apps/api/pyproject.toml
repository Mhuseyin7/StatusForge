[project]
name = "statusforge-api"
version = "0.1.0"
description = "StatusForge API and monitoring engine"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "argon2-cffi>=23.1,<24", "celery[redis]>=5.4,<6", "email-validator>=2.2,<3",
  "dnspython>=2.7,<3", "fastapi>=0.115,<1", "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.34,<1"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
